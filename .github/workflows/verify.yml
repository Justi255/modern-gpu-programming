name: Verify textbook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-and-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install documentation and CPU test dependencies
        run: python -m pip install -e '.[docs,test]'
      - name: Check GPU-independent contracts
        run: python -m pytest -q -m 'not gpu'
      - name: Build all paired TileLang and Triton chapters strictly
        run: python -m sphinx -n -W --keep-going -b html docs _build/html
      - name: Verify both backend routes are present without GPU imports
        run: |
          python - <<'PY'
          from pathlib import Path
          chapters = sorted(Path('_build/html').glob('[0-9][0-9]-*.html'))
          assert len(chapters) == 15, f'Expected all 15 chapters, found {len(chapters)}'
          for chapter in chapters:
              html = chapter.read_text()
              assert 'data-sync-group="kernel-backend"' in html, chapter
              assert 'data-sync-id="tilelang"' in html, chapter
              assert 'data-sync-id="triton"' in html, chapter
          assert Path('_build/html/_static/kernel-backend.js').is_file()
          PY
      - name: Retain browsable book
        uses: actions/upload-artifact@v4
        with:
          name: rtx5060-textbook-html
          path: _build/html
          retention-days: 14
