name: Verify textbook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-and-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install documentation and CPU test dependencies
        run: python -m pip install -e '.[docs,test]'
      - name: Check GPU-independent contracts
        run: python -m pytest -q -m 'not gpu'
      - name: Build complete Chinese textbook strictly
        run: python -m sphinx -n -W --keep-going -b html docs _build/html
      - name: Retain browsable book
        uses: actions/upload-artifact@v4
        with:
          name: rtx5060-textbook-html
          path: _build/html
          retention-days: 14
