<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img" aria-labelledby="title desc">
<title id="title">执行层次：grid → CTA → warp → lane</title><desc id="desc">本设备有26个SM。调度器将程序实例分派给SM，CTA内部有多个warp，每个warp固定32个lane。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#14243b"/></marker></defs>
<rect width="1080" height="490" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="24" fill="#14243b" text-anchor="start" font-weight="700">执行层次：grid → CTA → warp → lane</text><rect x="30" y="65" width="1020" height="95" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="50" y="93" font-size="18" fill="#14243b" text-anchor="start" font-weight="400">一次 launch 的 grid：彼此独立的程序实例</text><rect x="55" y="111" width="80" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="95.0" y="132.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="600">P0</text><rect x="152" y="111" width="80" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="192.0" y="132.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="600">P1</text><rect x="249" y="111" width="80" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="289.0" y="132.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="600">P2</text><rect x="346" y="111" width="80" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="386.0" y="132.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="600">P3</text><rect x="443" y="111" width="80" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="483.0" y="132.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="600">P4</text><rect x="540" y="111" width="80" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="580.0" y="132.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="600">P5</text><rect x="637" y="111" width="80" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="677.0" y="132.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="600">P6</text><rect x="734" y="111" width="80" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="774.0" y="132.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="600">P7</text><rect x="831" y="111" width="80" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="871.0" y="132.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="600">P8</text><rect x="928" y="111" width="80" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="968.0" y="132.0" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="600">P9</text><path d="M250 165 L250 205" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M540 165 L540 205" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M830 165 L830 205" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="210" width="290" height="110" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="56" y="237" font-size="19" fill="#0f766e" text-anchor="start" font-weight="600">SM 0</text><rect x="57" y="254" width="120" height="46" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="117.0" y="283.0" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="600">CTA / P</text><rect x="193" y="254" width="120" height="46" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="253.0" y="283.0" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="600">CTA / P</text><rect x="395" y="210" width="290" height="110" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="411" y="237" font-size="19" fill="#0f766e" text-anchor="start" font-weight="600">SM 1</text><rect x="412" y="254" width="120" height="46" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="472.0" y="283.0" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="600">CTA / P</text><rect x="548" y="254" width="120" height="46" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="608.0" y="283.0" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="600">CTA / P</text><rect x="750" y="210" width="290" height="110" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="766" y="237" font-size="19" fill="#0f766e" text-anchor="start" font-weight="600">SM …</text><rect x="767" y="254" width="120" height="46" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="827.0" y="283.0" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="600">CTA / P</text><rect x="903" y="254" width="120" height="46" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="963.0" y="283.0" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="600">CTA / P</text><text x="40" y="353" font-size="18" fill="#14243b" text-anchor="start" font-weight="400">放大一个 CTA（配置示例：num_warps=4）</text><rect x="40" y="370" width="235" height="55" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="157.5" y="403.5" font-size="17" fill="#7c3aed" text-anchor="middle" font-weight="600">warp 0：32 lanes</text><rect x="295" y="370" width="235" height="55" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="412.5" y="403.5" font-size="17" fill="#7c3aed" text-anchor="middle" font-weight="600">warp 1：32 lanes</text><rect x="550" y="370" width="235" height="55" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="667.5" y="403.5" font-size="17" fill="#7c3aed" text-anchor="middle" font-weight="600">warp 2：32 lanes</text><rect x="805" y="370" width="235" height="55" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="922.5" y="403.5" font-size="17" fill="#7c3aed" text-anchor="middle" font-weight="600">warp 3：32 lanes</text><text x="40" y="461" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">CTA 内共享内存与同步；CTA 之间不假定调度先后。一个 program 可处理远多于 thread 数的元素。</text></g></svg>
