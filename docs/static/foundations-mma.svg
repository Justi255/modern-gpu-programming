<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
<title id="title">SM120 的 warp 级矩阵乘加数据路径</title><desc id="desc">A与B经加载形成寄存器fragment，由warp级mma.sync更新FP32寄存器累加器。这里没有TMEM。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#14243b"/></marker></defs>
<rect width="1080" height="500" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="24" fill="#14243b" text-anchor="start" font-weight="700">SM120 的 warp 级矩阵乘加数据路径</text><rect x="35" y="105" width="220" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="145.0" y="158.5" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="600">全局内存 A / B</text><rect x="365" y="105" width="285" height="95" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="507.5" y="158.5" font-size="19" fill="#0f766e" text-anchor="middle" font-weight="600">共享内存 staging（可选）</text><rect x="760" y="105" width="275" height="95" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="897.5" y="158.5" font-size="18" fill="#7c3aed" text-anchor="middle" font-weight="600">warp 的 A / B fragments</text><path d="M264 152 L352 152" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M662 152 L748 152" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M145 212L145 245L894 245L894 213" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="515" y="269" font-size="16" fill="#64748b" text-anchor="middle" font-weight="400">具体 load 路径由内核与后端决定</text><path d="M897 284 L897 327" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="685" y="337" width="350" height="85" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="860.0" y="385.5" font-size="18" fill="#b45309" text-anchor="middle" font-weight="600">mma.sync：32 lanes 共同参与</text><rect x="35" y="337" width="430" height="85" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="250.0" y="385.5" font-size="19" fill="#7c3aed" text-anchor="middle" font-weight="600">FP32 累加器：thread 寄存器 fragments</text><path d="M673 379 L478 379" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="470" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">SM120 主线：FP16 / BF16 输入，FP32 累加。累加器占用寄存器预算，不使用 tcgen05 / TMEM。</text></g></svg>
