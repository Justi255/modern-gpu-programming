<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc">
<title id="title">布局转换把高效的读取连接到高效的写入</title><desc id="desc">一个4乘4矩阵经中间所有权交换被写为转置后的连续矩阵。中间机制取决于编译器。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#14243b"/></marker></defs>
<rect width="1080" height="460" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="24" fill="#14243b" text-anchor="start" font-weight="700">布局转换把高效的读取连接到高效的写入</text><text x="35" y="83" font-size="21" fill="#2563eb" text-anchor="start" font-weight="600">1　连续读取 A 的行</text><rect x="45" y="108" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="66.5" y="135.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">0,0</text><rect x="95" y="108" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="116.5" y="135.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">0,1</text><rect x="145" y="108" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="166.5" y="135.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">0,2</text><rect x="195" y="108" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="216.5" y="135.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">0,3</text><rect x="45" y="158" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="66.5" y="185.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">1,0</text><rect x="95" y="158" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="116.5" y="185.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">1,1</text><rect x="145" y="158" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="166.5" y="185.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">1,2</text><rect x="195" y="158" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="216.5" y="185.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">1,3</text><rect x="45" y="208" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="66.5" y="235.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">2,0</text><rect x="95" y="208" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="116.5" y="235.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">2,1</text><rect x="145" y="208" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="166.5" y="235.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">2,2</text><rect x="195" y="208" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="216.5" y="235.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">2,3</text><rect x="45" y="258" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="66.5" y="285.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">3,0</text><rect x="95" y="258" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="116.5" y="285.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">3,1</text><rect x="145" y="258" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="166.5" y="285.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">3,2</text><rect x="195" y="258" width="43" height="43" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="216.5" y="285.5" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">3,3</text><path d="M260 202 L363 202" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="386" y="83" font-size="21" fill="#0f766e" text-anchor="start" font-weight="600">2　交换所有权</text><rect x="382" y="108" width="268" height="193" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="516" y="163" font-size="19" fill="#0f766e" text-anchor="middle" font-weight="600">共享内存 / 寄存器交换</text><text x="516" y="201" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="400">布局由生产者与消费者决定</text><text x="516" y="241" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="400">安全复用需要适当同步</text><path d="M665 202 L764 202" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="789" y="83" font-size="21" fill="#7c3aed" text-anchor="start" font-weight="600">3　连续写出 B 的行</text><rect x="790" y="108" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="811.5" y="135.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">0,0</text><rect x="840" y="108" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="861.5" y="135.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">1,0</text><rect x="890" y="108" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="911.5" y="135.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">2,0</text><rect x="940" y="108" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="961.5" y="135.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">3,0</text><rect x="790" y="158" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="811.5" y="185.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">0,1</text><rect x="840" y="158" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="861.5" y="185.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">1,1</text><rect x="890" y="158" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="911.5" y="185.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">2,1</text><rect x="940" y="158" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="961.5" y="185.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">3,1</text><rect x="790" y="208" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="811.5" y="235.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">0,2</text><rect x="840" y="208" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="861.5" y="235.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">1,2</text><rect x="890" y="208" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="911.5" y="235.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">2,2</text><rect x="940" y="208" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="961.5" y="235.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">3,2</text><rect x="790" y="258" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="811.5" y="285.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">0,3</text><rect x="840" y="258" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="861.5" y="285.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">1,3</text><rect x="890" y="258" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="911.5" y="285.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">2,3</text><rect x="940" y="258" width="43" height="43" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/><text x="961.5" y="285.5" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="600">3,3</text><text x="40" y="354" font-size="19" fill="#14243b" text-anchor="start" font-weight="400">逻辑语义：B[j,i] = A[i,j]；输出连续，不是只修改 shape/stride 的视图。</text><text x="40" y="390" font-size="18" fill="#14243b" text-anchor="start" font-weight="400">先沿连续地址读取，再改变元素所有权，使消费者也能沿连续地址写出。</text><text x="40" y="432" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">图示是常见转置方案；实际 Triton 内核是否生成交换，必须检查编译结果。</text></g></svg>
