<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc">
<title id="title">软件流水：重叠阶段，并管理每个槽的生命周期</title><desc id="desc">串行时间线交替load与MMA，双缓冲时间线在不同槽中重叠load和MMA。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#14243b"/></marker></defs>
<rect width="1080" height="460" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="24" fill="#14243b" text-anchor="start" font-weight="700">软件流水：重叠阶段，并管理每个槽的生命周期</text><text x="35" y="89" font-size="20" fill="#14243b" text-anchor="start" font-weight="600">串行：同一缓冲区依次搬运与消费</text><rect x="170" y="110" width="94" height="45" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="217.0" y="138.5" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="600">load 0</text><rect x="268" y="110" width="100" height="45" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="318.0" y="138.5" font-size="17" fill="#b45309" text-anchor="middle" font-weight="600">MMA 0</text><rect x="375" y="110" width="94" height="45" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="422.0" y="138.5" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="600">load 1</text><rect x="473" y="110" width="100" height="45" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="523.0" y="138.5" font-size="17" fill="#b45309" text-anchor="middle" font-weight="600">MMA 1</text><rect x="580" y="110" width="94" height="45" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="627.0" y="138.5" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="600">load 2</text><rect x="678" y="110" width="100" height="45" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="728.0" y="138.5" font-size="17" fill="#b45309" text-anchor="middle" font-weight="600">MMA 2</text><rect x="785" y="110" width="94" height="45" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="832.0" y="138.5" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="600">load 3</text><rect x="883" y="110" width="100" height="45" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="933.0" y="138.5" font-size="17" fill="#b45309" text-anchor="middle" font-weight="600">MMA 3</text><text x="35" y="204" font-size="20" fill="#14243b" text-anchor="start" font-weight="600">双缓冲：下一块搬运与当前块计算重叠</text><text x="45" y="250" font-size="18" fill="#2563eb" text-anchor="start" font-weight="400">搬运</text><text x="45" y="325" font-size="18" fill="#b45309" text-anchor="start" font-weight="400">计算</text><rect x="170" y="220" width="150" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245.0" y="250.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="600">load 0 → 槽 0</text><rect x="335" y="295" width="150" height="48" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="410.0" y="325.0" font-size="17" fill="#b45309" text-anchor="middle" font-weight="600">MMA 0 ← 槽 0</text><path d="M245 272 L410 288" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="335" y="220" width="150" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="410.0" y="250.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="600">load 1 → 槽 1</text><rect x="500" y="295" width="150" height="48" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="575.0" y="325.0" font-size="17" fill="#b45309" text-anchor="middle" font-weight="600">MMA 1 ← 槽 1</text><path d="M410 272 L575 288" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="220" width="150" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="575.0" y="250.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="600">load 2 → 槽 0</text><rect x="665" y="295" width="150" height="48" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="740.0" y="325.0" font-size="17" fill="#b45309" text-anchor="middle" font-weight="600">MMA 2 ← 槽 0</text><path d="M575 272 L740 288" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="665" y="220" width="150" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="740.0" y="250.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="600">load 3 → 槽 1</text><rect x="830" y="295" width="150" height="48" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="905.0" y="325.0" font-size="17" fill="#b45309" text-anchor="middle" font-weight="600">MMA 3 ← 槽 1</text><path d="M740 272 L905 288" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="389" font-size="19" fill="#14243b" text-anchor="start" font-weight="400">消费者必须等数据到达；生产者复用槽之前，必须等旧消费者不再读取。</text><text x="40" y="429" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">这里只画等时长阶段以突出重叠。真实阶段时长、填充排空与资源占用需要测量。</text></g></svg>
