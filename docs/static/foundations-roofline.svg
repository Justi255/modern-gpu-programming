<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img" aria-labelledby="title desc">
<title id="title">Roofline：每项工作同时面对计算与搬运的约束</title><desc id="desc">低强度时计算吞吐受带宽乘算术强度限制，高强度时受计算峰值限制。实际点低于模型上界。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#14243b"/></marker></defs>
<rect width="1080" height="490" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="24" fill="#14243b" text-anchor="start" font-weight="700">Roofline：每项工作同时面对计算与搬运的约束</text><path d="M115 385 L1010 385" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M115 385 L115 85" fill="none" stroke="#14243b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="100" y="75" font-size="18" fill="#14243b" text-anchor="start" font-weight="400">吞吐 P</text><text x="1010" y="416" font-size="18" fill="#14243b" text-anchor="end" font-weight="400">算术强度 I</text><path d="M150 360L555 150L970 150" stroke="#2563eb" stroke-width="5" fill="none"/><path d="M555 150L555 385" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/><text x="280" y="245" font-size="21" fill="#2563eb" text-anchor="start" font-weight="400">带宽约束：I × W</text><text x="665" y="126" font-size="21" fill="#2563eb" text-anchor="start" font-weight="400">计算约束：P_peak</text><text x="555" y="417" font-size="18" fill="#14243b" text-anchor="middle" font-weight="400">拐点 I = P_peak / W</text><rect x="670" y="240" width="330" height="91" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="690" y="272" font-size="20" fill="#b45309" text-anchor="start" font-weight="600">理论上界不是测量结果</text><text x="690" y="304" font-size="17" fill="#b45309" text-anchor="start" font-weight="400">launch、依赖与并行度会继续限速</text><circle cx="300" cy="327" r="7" fill="#0f766e"/><circle cx="750" cy="205" r="7" fill="#0f766e"/><text x="40" y="462" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">示意图使用抽象坐标；应使用相同精度、相同存储边界的峰值与流量建立实际模型。</text></g></svg>
