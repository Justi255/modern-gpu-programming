<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="430" viewBox="0 0 1060 430" role="img" aria-labelledby="title desc">
<title id="title">分块 GEMM 的空间与归约维度</title><desc id="desc">A 的一组行与 B 的一组列沿 K 分段相乘，累计为 C 的一个输出块。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker></defs>
<rect width="1060" height="430" rx="20" fill="#f8fafc"/>
<g font-family="system-ui, 'Noto Sans CJK SC', sans-serif" fill="#0f172a">
<text x="35" y="43" font-size="23" font-weight="700">分块 GEMM：C[M,N] = A[M,K] × B[K,N]</text>
<text x="70" y="87" font-size="20" font-weight="600">A：固定一组 M 行</text>
<rect x="65" y="105" width="260" height="170" fill="#e2e8f0" stroke="#94a3b8"/>
<rect x="65" y="162" width="260" height="56" fill="#bfdbfe"/>
<rect x="130" y="162" width="65" height="56" fill="#2563eb"/>
<g stroke="#94a3b8"><path d="M130 105V275M195 105V275M260 105V275M65 162H325M65 218H325"/></g>
<text x="137" y="197" font-size="17" fill="white">Aᵢₖ</text>
<text x="165" y="301" font-size="16">K →</text><text x="24" y="195" font-size="16">M ↓</text>
<text x="392" y="87" font-size="20" font-weight="600">B：固定一组 N 列</text>
<rect x="390" y="105" width="240" height="170" fill="#e2e8f0" stroke="#94a3b8"/>
<rect x="470" y="105" width="80" height="170" fill="#a7f3d0"/>
<rect x="470" y="147.5" width="80" height="42.5" fill="#059669"/>
<g stroke="#94a3b8"><path d="M470 105V275M550 105V275M390 147.5H630M390 190H630M390 232.5H630"/></g>
<text x="488" y="176" font-size="17" fill="white">Bₖⱼ</text>
<text x="492" y="301" font-size="16">N →</text><text x="347" y="195" font-size="16">K ↓</text>
<path d="M646 191H713" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="737" y="87" font-size="20" font-weight="600">C：一个 program 的输出</text>
<rect x="740" y="105" width="240" height="170" fill="#e2e8f0" stroke="#94a3b8"/>
<rect x="820" y="162" width="80" height="56" fill="#fb923c"/>
<g stroke="#94a3b8"><path d="M820 105V275M900 105V275M740 162H980M740 218H980"/></g>
<text x="835" y="197" font-size="17">Cᵢⱼ</text>
<text x="838" y="301" font-size="16">N →</text>
<rect x="65" y="331" width="915" height="66" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="85" y="357" font-size="18" font-weight="600">沿 K 循环：acc = 0 → acc + Aᵢ₀B₀ⱼ → acc + Aᵢ₁B₁ⱼ → … → 写回</text>
<text x="85" y="383" font-size="16" fill="#475569">输出块彼此独立；同一块内的各段 K 必须累计到同一个 fp32 状态。</text>
</g></svg>
